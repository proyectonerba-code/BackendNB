<script src="js/unidos.js?v=5.5"></script>
<script>
  // Registro real contra el backend (mismo diseno)
  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var nombre = document.getElementById('fullName').value.trim();
    var email = document.getElementById('email').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var p1 = document.getElementById('password').value;
    var p2 = document.getElementById('confirmPassword').value;
    var btn = this.querySelector('button[type="submit"]');
    var label = btn.querySelector('span');
    var orig = label ? label.textContent : btn.textContent;
    if (p1 !== p2) { alert('Las contraseñas no coinciden.'); return; }
    if (label) label.textContent = 'Creando tu cuenta...';
    btn.disabled = true;
    try {
      var r = await UN.api('/api/register', { method: 'POST', body: { nombre: nombre, email: email, telefono: phone, password: p1 } });
      UN.setSession(r.token, r);
      try { sessionStorage.setItem('un_fresh_login', '1'); } catch (e) {}
      if (label) label.textContent = '¡Cuenta creada! Redirigiendo...';
      setTimeout(function () { location.href = 'cotizador.html'; }, 900);
    } catch (err) {
      alert(err.message);
      if (label) label.textContent = orig;
      btn.disabled = false;
    }
  });
  UN.rewriteLinks();
</script>
